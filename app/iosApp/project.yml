name: NowInAndroid
options:
  bundleIdPrefix: com.skydoves
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  NowInAndroid:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Now in Android
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: { }
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose Multiplatform is capped at 60Hz on ProMotion displays without this.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skydoves.nowinandroid
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COMPOSE_UI"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Room 3 and androidx.sqlite 2.7 no longer publish `iosX64`, so the shared framework is
        # built for Apple Silicon only and the Intel simulator slice is excluded.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - NiaKit
          - -ObjC
    preBuildScripts:
      - name: Compile Kotlin
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation"
            exit 0
          fi
          cd "$SRCROOT/../.."
          ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode
      # moko-resources ships its strings/images/files inside a `.bundle` next to the framework;
      # without this phase native iOS UI later cannot resolve `MR` resources at runtime.
      - name: Copy MOKO Resources
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation"
            exit 0
          fi
          cd "$SRCROOT/../.."
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            MOKO_TARGET=IosSimulatorArm64
          else
            MOKO_TARGET=IosArm64
          fi
          ./gradlew \
            ":app:shared:copyResources${CONFIGURATION}Framework${MOKO_TARGET}" \
            -Pmoko.resources.BUILT_PRODUCTS_DIR="$BUILT_PRODUCTS_DIR" \
            -Pmoko.resources.CONTENTS_FOLDER_PATH="$CONTENTS_FOLDER_PATH"
